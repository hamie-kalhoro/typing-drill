<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="typingDrill by HAMiD">
  <style>
    /* Animated in browsers that animate SVG favicons (e.g. Firefox); others show the first frame. */
    .caret { animation: blink 1.1s steps(1) infinite; }
    .s1 { animation: streak 1.6s ease-in-out infinite; }
    .s2 { animation: streak 1.6s ease-in-out 0.2s infinite; }
    .s3 { animation: streak 1.6s ease-in-out 0.4s infinite; }
    .cap { animation: press 3.2s ease-in-out infinite; transform-origin: 35px 30px; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes streak { 0%, 100% { transform: translateX(0); opacity: 1; } 50% { transform: translateX(-2.5px); opacity: 0.55; } }
    @keyframes press { 0%, 88%, 100% { transform: translateY(0); } 92% { transform: translateY(2.5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e08a69"/>
      <stop offset="1" stop-color="#b9532f"/>
    </linearGradient>
    <linearGradient id="capg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3efe6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <g stroke="#ffffff" stroke-linecap="round" stroke-width="3">
    <line class="s1" x1="6" y1="24" x2="12" y2="24" stroke-opacity="0.55"/>
    <line class="s2" x1="4" y1="32" x2="12" y2="32" stroke-opacity="0.85"/>
    <line class="s3" x1="7" y1="40" x2="12" y2="40" stroke-opacity="0.55"/>
  </g>

  <rect x="16" y="15" width="38" height="38" rx="9" fill="#8f3e22" fill-opacity="0.45"/>
  <g class="cap">
    <rect x="16" y="11" width="38" height="37" rx="9" fill="url(#capg)"/>
    <path fill="#b9532f" d="M24 18.5h22v6h-2.6l-1-2.8H37.2v16.6l2.8 1.1V42H30v-2.6l2.8-1.1V21.7h-5.2l-1 2.8H24z"/>
    <rect class="caret" x="44" y="30" width="3" height="12" rx="1.5" fill="#d97757"/>
  </g>
</svg>
